name: Peygir release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Check connections or deploy only web/API from main'
        type: choice
        required: true
        default: check
        options: [check, deploy-server]
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: peygir-android-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  connection:
    name: Check VPS connection (no publication)
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'check' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check release tooling
        run: |
          python3 -m unittest discover -s scripts/ci/tests -v
          bash scripts/ci/tests/deploy_smoke.sh
      - name: Verify SSH, running API and update publisher
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/root/peygir/Peygir-VPS' }}
        run: bash scripts/ci/deploy_android_update.sh check
      - name: Verify server deployment prerequisites
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/root/peygir/Peygir-VPS' }}
        run: bash scripts/ci/deploy_server.sh check

  server_checks:
    name: Test and package web/API
    if: github.event_name == 'push' || (inputs.operation == 'deploy-server' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: vps/package-lock.json
      - name: Validate release tooling and run server tests
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 -m unittest discover -s scripts/ci/tests -v
          bash scripts/ci/tests/deploy_smoke.sh
          bash scripts/ci/tests/server_deploy_smoke.sh
          npm ci --prefix vps --ignore-scripts
          npm test --prefix vps
      - name: Run web browser tests
        working-directory: vps
        run: |
          npx playwright install --with-deps chromium webkit
          npx playwright test
      - name: Create server deployment package
        id: package
        env:
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [[ "$RELEASE_EVENT" == push ]]; then args+=(--tag "$RELEASE_TAG"); fi
          python3 scripts/ci/server_release.py --commit "$RELEASE_COMMIT" "${args[@]}" --output "$RUNNER_TEMP/server.tar.gz"
          python3 -c 'import json,os; print("version="+json.load(open("vps/package.json"))["version"],file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - name: Verify packaged Docker image, offline backup and migration
        run: |
          mkdir "$RUNNER_TEMP/server-context"
          tar -xzf "$RUNNER_TEMP/server.tar.gz" -C "$RUNNER_TEMP/server-context"
          docker build -t peygir-api:automation-check -f "$RUNNER_TEMP/server-context/vps/Dockerfile" "$RUNNER_TEMP/server-context"
          python3 scripts/ci/tests/server_docker_integration.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-release
          path: ${{ runner.temp }}/server.tar.gz
          retention-days: 14
          if-no-files-found: error

  build:
    name: Test, build and sign APK
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, notes and main history
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 -m unittest discover -s scripts/ci/tests -v
          bash scripts/ci/tests/deploy_smoke.sh
          python3 scripts/ci/android_release.py validate --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK packages
        run: |
          android_sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$android_sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            echo "Android SDK manager was not found at $sdkmanager_path" >&2
            exit 1
          fi
          "$sdkmanager_path" --sdk_root="$android_sdk_root" 'platforms;android-35' 'build-tools;35.0.0'
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$android_sdk_root" "$android_sdk_root" >> "$GITHUB_ENV"
      - name: Run Android checks and build unsigned release
        id: android_checks
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --no-daemon --max-workers=2 --console=plain
      - name: Save Android failure reports
        if: failure() && steps.android_checks.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-check-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 7
      - name: Sign with the existing Peygir key and verify certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/ci/android_release.py sign \
            --unsigned app/build/outputs/apk/release/app-release-unsigned.apk \
            --output "$RUNNER_TEMP/Peygir.apk" \
            --tools "$ANDROID_HOME/build-tools/35.0.0"
      - name: Prepare versioned APK and manifest
        env:
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 scripts/publish_android_update.py \
            --apk "$RUNNER_TEMP/Peygir.apk" \
            --output "$RUNNER_TEMP/android-update" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --notes-file "$RELEASE_NOTES"
          python3 scripts/ci/android_release.py package \
            --directory "$RUNNER_TEMP/android-update" --version "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-update
          path: ${{ runner.temp }}/android-update/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish verified APK on VPS
    needs: [build, server_deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: android-update
          path: ${{ runner.temp }}/android-update/
      - name: Transfer, publish and verify public update
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/root/peygir/Peygir-VPS' }}
          UPDATE_ORIGIN: ${{ vars.UPDATE_ORIGIN || 'https://peygir.hydrocode.ir' }}
        run: bash scripts/ci/deploy_android_update.sh publish "$RUNNER_TEMP/android-update"

  server_deploy:
    name: Back up and upgrade web/API on VPS
    needs: [server_checks, build]
    if: >-
      always() && !cancelled() && needs.server_checks.result == 'success' &&
      (needs.build.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy-server' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: server-release
          path: ${{ runner.temp }}/server-release/
      - name: Deploy tested server image using existing private settings
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_APP_DIR: ${{ vars.VPS_APP_DIR || '/root/peygir/Peygir-VPS' }}
          UPDATE_ORIGIN: ${{ vars.UPDATE_ORIGIN || 'https://peygir.hydrocode.ir' }}
          SERVER_VERSION: ${{ needs.server_checks.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: bash scripts/ci/deploy_server.sh publish "$RUNNER_TEMP/server-release/server.tar.gz" "$SERVER_VERSION" "$RELEASE_COMMIT"
