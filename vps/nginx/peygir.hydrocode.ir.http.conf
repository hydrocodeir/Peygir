# Bootstrap only: issue the certificate before installing the HTTPS configuration.
server {
    listen 80;
    listen [::]:80;
    server_name peygir.hydrocode.ir;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # No login or API traffic over HTTP during certificate setup.
    location / {
        return 404;
    }
}
