server {
    listen 80;
    listen [::]:80;
    server_name peygir.hydrocode.ir;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://peygir.hydrocode.ir$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name peygir.hydrocode.ir;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/peygir.hydrocode.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/peygir.hydrocode.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:18300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # This Nginx is the public ingress. Replace any client-supplied forwarding IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_cache off;
    }
}
